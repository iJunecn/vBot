# vBot docker-compose 示例
# 使用前请把 .env.example 复制为 .env 并填好 APPID / SECRET：
#   cp .env.example .env && vim .env

services:
  vbot:
    build:
      context: .
      dockerfile: Dockerfile
    image: vbot:latest
    container_name: vbot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # 把配置和源码以只读方式挂载，方便本地修改即时生效（生产可去掉）
      - ./config.yaml:/app/config.yaml:ro
      - ./src:/app/src:ro
    # 网络模式默认 bridge 即可，QQ Bot API 与 vUSTB 都需要出网
    networks:
      - vbot-net

networks:
  vbot-net:
    driver: bridge
